<VirtualHost *:80>
    DocumentRoot /var/www/html

    # Встановлюємо детальний рівень логування
    LogLevel debug

    # Це спеціальне налаштування для Docker:
    # Воно направляє логи помилок Apache в стандартний вивід контейнера,
    # щоб ви могли їх бачити через 'docker logs'
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        # Дозволяє використовувати .htaccess, що є частою причиною помилок
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
